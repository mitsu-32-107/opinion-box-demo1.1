<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学友会 意見箱ポータル（学生用）</title>
  <style>
    :root { --primary: #2563eb; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #1f2937; --border: #e5e7eb; }
    body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
    
    .app-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; color: var(--primary); }
    
    .grid-layout { display: flex; flex-direction: column; gap: 24px; }
    @media (min-width: 768px) {
      .grid-layout { flex-direction: row; align-items: flex-start; }
      .form-section { flex: 1; position: sticky; top: 20px; }
      .faq-section { flex: 1; }
    }
    
    .card { background-color: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 16px; }
    
    .rule-box { background-color: #eff6ff; border-left: 4px solid var(--primary); padding: 16px; margin-bottom: 24px; border-radius: 0 8px 8px 0; font-size: 0.9rem; color: #334155; }
    .rule-box strong { color: #1e40af; display: block; margin-bottom: 8px; font-size: 1rem;}
    .rule-box ul { margin: 0; padding-left: 20px; line-height: 1.6; }
    .rule-box li { margin-bottom: 4px; }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; }
    .badge-req { background-color: #ef4444; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
    .badge-opt { background-color: #6b7280; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
    input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    
    .radio-group { display: flex; gap: 20px; margin-top: 8px; }
    .radio-label { font-weight: normal; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }

    .submit-btn { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    
    .section-title { font-size: 1.2rem; color: #374151; margin-top: 0; margin-bottom: 16px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; display: inline-block; }
    
    .faq-question { font-weight: bold; border-left: 4px solid var(--primary); padding-left: 12px; margin-bottom: 12px; color: #1f2937; }
    .faq-answer { background-color: #eff6ff; padding: 16px; border-radius: 8px; color: #1e3a8a; font-size: 0.95rem; line-height: 1.6; }
    .tag { font-size: 0.75rem; padding: 4px 8px; border-radius: 20px; font-weight: bold; display: inline-block; background-color: #f3e8ff; color: #6b21a8; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>学友会 意見箱ポータル</h1>
      <p style="font-size: 0.9rem; color: #6b7280;">より良い大学生活のために、ご意見をお寄せください。</p>
    </header>

    <div class="grid-layout">
      <section class="form-section card">
        <h2 class="section-title">意見・要望を送信する</h2>
        
        <div class="rule-box">
          <strong>【ご意見の取り扱いと回答について】</strong>
          <ul>
            <li>いただいたご意見は、原則として右側の「回答一覧」にて公開されます。</li>
            <li>「個人情報が含まれるもの」や「個別対応が必要なデリケートな内容」は、全体公開を行わず、入力いただいたメールアドレス宛に直接回答（または非公開で対応完了）とさせていただく場合があります。</li>
            <li>単なるご報告など、回答を必要としないご意見も歓迎いたします。</li>
          </ul>
        </div>

        <form id="opinionForm" onsubmit="submitOpinion(event)">
          
          <div class="form-group">
            <label>回答の希望<span class="badge-req">必須</span></label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="replyPref" value="希望する" checked> 回答を希望する
              </label>
              <label class="radio-label">
                <!-- ★ ここを「希望しない（共有のみ）」に完全統一しました -->
                <input type="radio" name="replyPref" value="希望しない（共有のみ）"> 希望しない（共有のみ）
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>あて先<span class="badge-req">必須</span></label>
            <select id="target" required>
              <option value="" disabled selected>選択してください</option>
              <option value="大学（教職員宛）">大学（教職員宛）</option>
              <option value="学友会執行委員会宛">学友会執行委員会宛</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>カテゴリ<span class="badge-req">必須</span></label>
            <select id="category" required onchange="toggleCategoryOther()">
              <option value="" disabled selected>選択してください</option>
              <option value="施設・設備について">施設・設備について</option>
              <option value="授業・履修について">授業・履修について</option>
              <option value="学友会活動について">学友会活動について</option>
              <option value="その他">その他</option>
            </select>
            <input type="text" id="category-other" maxlength="20" placeholder="具体的なカテゴリ（20文字以内）" style="display:none; margin-top: 8px;">
          </div>
          
          <div class="form-group">
            <label>意見・要望の内容<span class="badge-req">必須</span></label>
            <textarea id="content" rows="5" required placeholder="具体的な内容を記入してください。"></textarea>
          </div>

          <hr style="border:0; border-top:1px solid #e5e7eb; margin: 20px 0;">
          <p style="font-size:0.8rem; color:#6b7280; margin-bottom:12px;">※個別回答を希望する場合は以下も入力してください。</p>

          <div style="display: flex; gap: 12px; margin-bottom: 20px;">
            <div style="flex: 1;">
              <label>所属・学年<span class="badge-opt">任意</span></label>
              <select id="grade">
                <option value="未回答">選択しない</option>
                <option value="学部生">学部生</option>
                <option value="大学院生">大学院生</option>
                <option value="教職員">教職員</option>
              </select>
            </div>
            <div style="flex: 1;">
              <label>性別<span class="badge-opt">任意</span></label>
              <select id="gender">
                <option value="未回答">選択しない</option>
                <option value="男性">男性</option>
                <option value="女性">女性</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>氏名<span class="badge-opt">任意</span></label>
            <input type="text" id="userName" placeholder="例：千葉 太郎">
          </div>
          <div class="form-group">
            <label>連絡先（メール）<span class="badge-opt">任意</span></label>
            <input type="email" id="email" placeholder="例：example@example.com">
          </div>

          <button type="submit" class="submit-btn">意見を送信する</button>
        </form>
      </section>

      <section class="faq-section">
        <h2 class="section-title" style="border-color: #8b5cf6; color: #4c1d95;">公開された回答一覧</h2>
        <div id="public-list"></div>
      </section>
    </div>
  </div>

  <script>
    function toggleCategoryOther() {
      const cat = document.getElementById('category').value;
      const otherInput = document.getElementById('category-other');
      if(cat === 'その他') {
        otherInput.style.display = 'block';
        otherInput.required = true;
      } else {
        otherInput.style.display = 'none';
        otherInput.required = false;
        otherInput.value = "";
      }
    }

    function submitOpinion(e) {
      e.preventDefault();
      
      let finalCategory = document.getElementById('category').value;
      if (finalCategory === 'その他') {
        const otherText = document.getElementById('category-other').value;
        finalCategory = `その他（${otherText}）`;
      }

      const replyPref = document.querySelector('input[name="replyPref"]:checked').value;
      const rawContent = document.getElementById('content').value;
      const combinedContent = `【回答の希望：${replyPref}】\n\n${rawContent}`;

      const newOpinion = {
        id: Date.now(),
        date: new Date().toLocaleDateString('ja-JP'), 
        target: document.getElementById('target').value,
        category: finalCategory,
        content: combinedContent,
        grade: document.getElementById('grade').value,
        gender: document.getElementById('gender').value,
        name: document.getElementById('userName').value || "匿名",
        email: document.getElementById('email').value || "なし",
        status: "未処理（確認待ち）",
        replyText: "",
        history: [{ time: new Date().toLocaleString('ja-JP'), action: "学生から意見が投稿されました", detail: "" }]
      };

      let opinions = JSON.parse(localStorage.getItem('appOpinionsData')) || [];
      opinions.unshift(newOpinion);
      localStorage.setItem('appOpinionsData', JSON.stringify(opinions));

      alert("送信が完了しました！ご意見ありがとうございます。");
      document.getElementById('opinionForm').reset();
      toggleCategoryOther(); 
      renderPublicFAQ(); 
    }

    function renderPublicFAQ() {
      const opinions = JSON.parse(localStorage.getItem('appOpinionsData')) || [];
      const listContainer = document.getElementById('public-list');
      listContainer.innerHTML = ""; 

      const publicOpinions = opinions.filter(op => op.status === "公開済み");

      if(publicOpinions.length === 0) {
        listContainer.innerHTML = `<div class="card" style="text-align:center; color:#6b7280;">現在、公開されている回答はありません。</div>`;
        return;
      }

      publicOpinions.forEach(op => {
        const card = document.createElement('div');
        card.className = 'card';
        
        let publishDateHtml = op.publishDate ? `<div style="font-size: 0.85rem; color: #059669; font-weight: bold; margin-bottom: 8px;">🗓 回答公開日: ${op.publishDate}</div>` : "";

        let displayContent = op.content.replace(/【回答の希望：.*?】\n\n/, '');

        card.innerHTML = `
          <span class="tag">${op.category}</span>
          <div class="faq-question">
            <span style="font-size: 0.8rem; color: #6b7280; font-weight: normal;">投稿日: ${op.date}</span><br>
            【学生からの意見】<br>${displayContent}
          </div>
          <div class="faq-answer">
            ${publishDateHtml}
            <strong>【${op.target.replace('宛', '')}からの回答】</strong><br>${op.replyText}
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    renderPublicFAQ();
  </script>
</body>
</html>
