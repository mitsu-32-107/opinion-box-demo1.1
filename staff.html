<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教職員用 回答ダッシュボード</title>
  <style>
    :root { --staff-primary: #047857; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; }
    body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
    .staff-header { background-color: var(--staff-primary); color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .staff-header h1 { margin: 0; font-size: 1.2rem; }
    .container { max-width: 800px; margin: 20px auto; padding: 0 20px; }
    
    .tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 24px; overflow-x: auto; }
    .tab { flex: 1; text-align: center; padding: 12px 8px; cursor: pointer; font-weight: bold; color: #64748b; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; font-size: 0.95rem; }
    .tab.active { color: #047857; border-bottom-color: #047857; background-color: #ecfdf5; }
    .tab:hover:not(.active) { background-color: #f1f5f9; }
    
    .opinion-card { background-color: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 16px; border-left: 5px solid #10b981; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: bold; display: inline-block; margin-right: 8px; margin-bottom: 8px; }
    .tag-target { background-color: #dbeafe; color: #1e40af; }
    .tag-category { background-color: #f3e8ff; color: #6b21a8; }
    .tag-status { background-color: #fee2e2; color: #991b1b; }
    .tag-status.waiting { background-color: #e0e7ff; color: #3730a3; }
    .tag-status.ready { background-color: #fef08a; color: #854d0e; }
    .tag-status.published { background-color: #d1fae5; color: #065f46; }

    /* ★ 回答希望のバッジ用スタイル */
    .tag-reply-yes { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .tag-reply-no { background-color: #f8fafc; color: #475569; border: 1px solid #cbd5e1; }

    .opinion-body { font-size: 1rem; line-height: 1.6; white-space: pre-wrap; margin: 12px 0; padding: 12px; background-color: #f1f5f9; border-radius: 4px; border-left: 3px solid #cbd5e1;}
    .reply-box { background-color: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 4px; margin-top: 12px; font-size: 0.95rem; }
    .action-btn { background-color: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; }
    .cancel-btn { background-color: #64748b; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .alert-btn { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    textarea { width: 100%; height: 120px; padding: 10px; font-family: inherit; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; resize: vertical; margin-top: 8px; }
  </style>
</head>
<body>
  <header class="staff-header">
    <h1>教職員用 回答ダッシュボード</h1>
    <div style="font-size: 0.85rem; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 4px;">関係者外秘</div>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" id="tab-todo" onclick="setStaffTab('todo')">未対応（要回答）</div>
      <div class="tab" id="tab-sent" onclick="setStaffTab('sent')">送信済み（確認待ち）</div>
      <div class="tab" id="tab-published" onclick="setStaffTab('published')">公開中</div>
    </div>

    <div id="staff-list"></div>
  </div>

  <script>
    let currentStaffTab = 'todo'; 

    function setStaffTab(tabName) {
      currentStaffTab = tabName;
      document.getElementById('tab-todo').classList.remove('active');
      document.getElementById('tab-sent').classList.remove('active');
      document.getElementById('tab-published').classList.remove('active');
      
      document.getElementById('tab-' + tabName).classList.add('active');
      renderStaffDashboard();
    }

    function addHistoryLog(op, action, detail = "") {
      if (!op.history) op.history = [];
      const now = new Date().toLocaleString('ja-JP');
      op.history.push({ time: now, action: action, detail: detail });
    }

    function renderStaffDashboard() {
      const opinions = JSON.parse(localStorage.getItem('appOpinionsData')) || [];
      const listContainer = document.getElementById('staff-list');
      listContainer.innerHTML = ""; 

      let staffOpinions = opinions.filter(op => 
        op.status !== "未処理（確認待ち）" && 
        !(op.target && op.target.includes("学友会"))
      );

      if (currentStaffTab === 'todo') {
        staffOpinions = staffOpinions.filter(op => op.status === "教職員回答待ち");
      } else if (currentStaffTab === 'sent') {
        staffOpinions = staffOpinions.filter(op => op.status === "回答済み（厚生部確認待ち）");
      } else if (currentStaffTab === 'published') {
        staffOpinions = staffOpinions.filter(op => op.status === "公開済み");
      }

      if(staffOpinions.length === 0) {
        let emptyMsg = "";
        if (currentStaffTab === 'todo') {
          emptyMsg = "現在、未対応の回答依頼はありません。";
        } else if (currentStaffTab === 'sent') {
          emptyMsg = "現在、厚生部の確認待ちとなっている回答はありません。";
        } else {
          emptyMsg = "現在、公開されている回答はありません。";
        }
        listContainer.innerHTML = `<p style="text-align:center; color:#64748b; padding: 40px 0;">${emptyMsg}</p>`;
        return;
      }

      staffOpinions.forEach(op => {
        const card = document.createElement('div');
        card.className = 'opinion-card';
        
        let statusClass = "tag-status";
        if(op.status === "教職員回答待ち") statusClass += " waiting";
        if(op.status === "回答済み（厚生部確認待ち）") statusClass += " ready";
        if(op.status === "公開済み") statusClass += " published";

        // ★ 文字から「回答希望」のバッジを生成する
        let replyPrefBadge = "";
        if (op.content.includes("【回答の希望：希望しない")) {
          replyPrefBadge = `<span class="tag tag-reply-no">📢 回答不要（共有のみ）</span>`;
        } else if (op.content.includes("【回答の希望：希望する")) {
          replyPrefBadge = `<span class="tag tag-reply-yes">✍️ 要回答</span>`;
        }

        let actionArea = "";
        
        if(op.status === "教職員回答待ち") {
          actionArea = `
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px dashed #cbd5e1;">
              <strong>✏️ 回答を入力してください</strong>
              <textarea id="reply-input-${op.id}" placeholder="学生への回答を記入してください...">${op.replyText || ""}</textarea>
              <div style="margin-top: 12px; text-align: right;">
                <button class="action-btn" onclick="submitReply(${op.id})">回答を保存して厚生部へ送信</button>
              </div>
            </div>
          `;
        } 
        else if(op.status === "回答済み（厚生部確認待ち）") {
          let timeHtml = op.replyDate ? `<div style="font-size: 0.8rem; color: #10b981; margin-bottom: 4px; font-weight: bold;">🕰 送信時刻: ${op.replyDate}</div>` : "";
          actionArea = `
            <div class="reply-box">
              ${timeHtml}
              <strong>送信済みの回答内容（厚生部確認中）:</strong><br>${op.replyText}
            </div>
            <div style="margin-top: 12px; display: flex; justify-content: flex-end; align-items: center;">
              <p style="font-size:0.85rem; color:#64748b; margin-right: 16px;">※厚生部で内容を確認後、公開されます。</p>
              <button class="cancel-btn" onclick="cancelReply(${op.id})">送信を取り消す（再編集）</button>
            </div>
          `;
        } 
        else if(op.status === "公開済み") {
          let timeHtml = op.replyDate ? `<div style="font-size: 0.8rem; color: #059669; margin-bottom: 4px; font-weight: bold;">🕰 送信時刻: ${op.replyDate}</div>` : "";
          actionArea = `
            <div class="reply-box" style="background:#d1fae5; border-color:#a7f3d0;">
              ${timeHtml}
              <strong>現在公開中の回答:</strong><br>${op.replyText}
            </div>
            <div style="margin-top: 12px; text-align: right;">
              <button class="alert-btn" onclick="requestUnpublish(${op.id})">厚生部へ公開停止・修正を依頼する</button>
            </div>
          `;
        }

        // ★ 本文から【回答の希望：〜】の文字を消す
        let displayContent = op.content.replace(/【回答の希望：.*?】\n\n/, '');

        card.innerHTML = `
          <div>
            ${replyPrefBadge}
            <span class="tag tag-target">宛先: ${op.target}</span>
            <span class="tag tag-category">${op.category}</span>
            <span class="tag ${statusClass}">${op.status}</span>
          </div>
          <div style="font-size: 0.85rem; color: #64748b; margin-top: 8px;">【学生からの意見】</div>
          <div class="opinion-body">${displayContent}</div>
          ${actionArea}
        `;
        listContainer.appendChild(card);
      });
    }

    function submitReply(id) {
      const reply = document.getElementById(`reply-input-${id}`).value;
      if (!reply.trim()) {
        alert("回答を入力してください。");
        return;
      }
      
      let opinions = JSON.parse(localStorage.getItem('appOpinionsData')) || [];
      opinions = opinions.map(op => { 
        if(op.id === id) {
          op.status = "回答済み（厚生部確認待ち）";
          op.replyText = reply;
          op.replyDate = new Date().toLocaleString('ja-JP');
          addHistoryLog(op, "教職員が回答を送信しました");
        }
        return op; 
      });
      localStorage.setItem('appOpinionsData', JSON.stringify(opinions));
      alert("回答を厚生部へ送信しました。");
      renderStaffDashboard();
    }

    function cancelReply(id) {
      if(!confirm("厚生部への送信を取り消しますか？\n（入力した回答は残ったまま、再編集できるようになります）")) return;

      let opinions = JSON.parse(localStorage.getItem('appOpinionsData')) || [];
      opinions = opinions.map(op => { 
        if(op.id === id) {
          op.status = "教職員回答待ち"; 
          addHistoryLog(op, "教職員が回答の送信を取り消しました");
        }
        return op; 
      });
      localStorage.setItem('appOpinionsData', JSON.stringify(opinions));
      renderStaffDashboard();
    }

    function requestUnpublish(id) {
      if(!confirm("【重要】この回答の公開を直ちに停止し、厚生部へ修正依頼を出しますか？")) return;
      
      let message = prompt("公開を停止する理由や、修正したい内容を厚生部宛てに記入してください（※必須）：");
      if (message === null) return; 
      
      if (message.trim() === "") {
        alert("【エラー】公開停止の理由は必須です。処理をキャンセルしました。");
        return;
      }
      
      let opinions = JSON.parse(localStorage.getItem('appOpinionsData')) || [];
      opinions = opinions.map(op => { 
        if(op.id === id) {
          op.status = "回答済み（厚生部確認待ち）"; 
          let detail = `【教職員からのメッセージ】\n${message}`;
          addHistoryLog(op, "教職員から緊急の公開停止・修正依頼がありました", detail);
        }
        return op; 
      });
      localStorage.setItem('appOpinionsData', JSON.stringify(opinions));
      alert("公開を停止し、厚生部へ依頼を送信しました。");
      renderStaffDashboard();
    }

    renderStaffDashboard();
  </script>
</body>
</html>
